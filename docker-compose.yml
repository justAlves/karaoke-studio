services:
  karaoke-studio:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: karaoke-studio
    restart: unless-stopped
    ports:
      - "8000:8000"
    environment:
      KARAOKE_HOST: "${KARAOKE_HOST:-}"
      KARAOKE_PASSWORD: "${KARAOKE_PASSWORD:-}"
      KARAOKE_AUTH_SECRET: "${KARAOKE_AUTH_SECRET:-}"
      KARAOKE_COOKIE_SECURE: "${KARAOKE_COOKIE_SECURE:-true}"
    volumes:
      - karaoke-data:/app/data
      - karaoke-downloads:/app/downloads
      - karaoke-models:/app/models
      - karaoke-stems:/app/stems

volumes:
  karaoke-data:
  karaoke-downloads:
  karaoke-models:
  karaoke-stems:
