services:
  karaoke-studio:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: karaoke-studio
    restart: unless-stopped
    ports:
      - "8000:8000"
    environment:
      KARAOKE_HOST: "${KARAOKE_HOST:-}"
      KARAOKE_PUBLIC_URL: "${KARAOKE_PUBLIC_URL:-}"
      KARAOKE_PASSWORD: "${KARAOKE_PASSWORD:-}"
      KARAOKE_AUTH_SECRET: "${KARAOKE_AUTH_SECRET:-}"
      KARAOKE_COOKIE_SECURE: "${KARAOKE_COOKIE_SECURE:-true}"
      R2_ENDPOINT_URL: "${R2_ENDPOINT_URL:-}"
      R2_ACCESS_KEY_ID: "${R2_ACCESS_KEY_ID:-}"
      R2_SECRET_ACCESS_KEY: "${R2_SECRET_ACCESS_KEY:-}"
      R2_BUCKET_NAME: "${R2_BUCKET_NAME:-}"
      FIREBASE_SERVICE_ACCOUNT_B64: "${FIREBASE_SERVICE_ACCOUNT_B64:-}"
    volumes:
      - karaoke-data:/app/data
      - karaoke-downloads:/app/downloads
      - karaoke-models:/app/models
      - karaoke-stems:/app/stems

volumes:
  karaoke-data:
  karaoke-downloads:
  karaoke-models:
  karaoke-stems:
